services:
  ui:
    build:
      context: ./gym-UI
      dockerfile: Dockerfile
    container_name: gym_ui_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

  api:
    build:
      context: ./gym-api
      dockerfile: Dockerfile
    container_name: gym_api_prod
    restart: always
    env_file:
      - ./gym-api/.env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      - mysql
      - redis
    volumes:
      - api_storage:/var/www/html/storage
      - api_bootstrap:/var/www/html/bootstrap/cache

  mysql:
    image: mysql:8.0
    container_name: gym_mysql_prod
    restart: always
    environment:
      MYSQL_DATABASE: gym_db
      MYSQL_ROOT_PASSWORD: mechtirazi52295730
    volumes:
      - mysql_data_prod:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: gym_redis_prod
    restart: always
    volumes:
      - redis_data_prod:/data

volumes:
  api_storage:
  api_bootstrap:
  mysql_data_prod:
  redis_data_prod:
