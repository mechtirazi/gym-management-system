[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = "php artisan migrate --force && php artisan passport:client --personal --name='Gym Personal Access Client' --no-interaction || true"
startCommand = "/usr/local/bin/docker-start.sh"
healthcheckPath = "/api/auth/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
