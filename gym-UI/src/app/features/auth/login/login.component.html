<div class="login-container">
  <div class="glass-card login-card">

    <!-- Header -->
    <div class="text-center mb-8">
      <div class="gym-logo">
        <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>

      <h2>Welcome Back</h2>
      <p>Sign in to your fitness dashboard</p>
    </div>

    <!-- FORM -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">

      <!-- EMAIL -->
      <div class="form-group">
        <label for="login-email">Email Address</label>
        <div class="input-wrapper">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9" />
          </svg>

          <input id="login-email" type="email" formControlName="email" placeholder="name@example.com"
            autocomplete="email" required>
        </div>
      </div>

      <!-- PASSWORD -->
      <div class="form-group">
        <div class="password-header">
          <label for="login-password">Password</label>
          <button type="button" class="show-btn" (click)="togglePassword()">
            {{ showPassword() ? 'Hide' : 'Show' }}
          </button>
        </div>

        <div class="input-wrapper">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>

          <input id="login-password" [type]="showPassword() ? 'text' : 'password'" formControlName="password"
            placeholder="Enter your password" autocomplete="current-password" required>
        </div>
      </div>

      <!-- REMEMBER -->
      <div class="remember-forgot">

        <label class="remember">
          <input type="checkbox">
          <div class="check">
            <svg fill="currentColor" viewBox="0 0 20 20">
              <path
                d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" />
            </svg>
          </div>
          <span>Remember me</span>
        </label>

        <a routerLink="/auth/forgot-password" class="forgot">Forgot password?</a>

      </div>

      <!-- BUTTON -->
      <button type="submit" class="submit-btn" [disabled]="loginForm.invalid || isLoading()">
        <ng-container *ngIf="isLoading()">
          <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10" stroke-width="4" style="opacity: 0.25;"></circle>
            <path style="opacity: 0.75;" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
          </svg>
          Signing in...
        </ng-container>
        <span *ngIf="!isLoading()">Sign in to Dashboard</span>
      </button>

      <!-- ERROR -->
      <div *ngIf="errorMessage()" class="error">
        {{ errorMessage() }}
      </div>

    </form>

    <!-- Divider -->
    <div class="divider">
      <span>Or continue with</span>
    </div>

    <!-- Social -->
    <div class="social-grid">

      <button type="button" class="social-btn" (click)="loginWith('google')">
        <svg viewBox="0 0 24 24">
          <path
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            fill="#4285F4" />
          <path
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            fill="#34A853" />
          <path
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
            fill="#FBBC05" />
          <path
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            fill="#EA4335" />
        </svg>
        Google
      </button>



      <button type="button" class="social-btn" (click)="loginWith('facebook')">
        <svg viewBox="0 0 24 24" fill="#1877F2">
          <path
            d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
        </svg>
        FB
      </button>

    </div>

    <!-- Signup -->
    <div class="signup">
      <p>
        New to the gym?
        <a routerLink="/auth/register">Create account</a>
      </p>
    </div>

  </div>
</div>
