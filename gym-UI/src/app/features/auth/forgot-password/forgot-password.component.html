<div class="login-container">
  <div class="glass-card login-card">

    <!-- Header -->
    <div class="text-center mb-8">
      <div class="gym-logo">
        <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>

      <h2>Reset Password</h2>
      <p *ngIf="step() === 1">Enter your email or phone number to receive a verification code.</p>
      <p *ngIf="step() === 2">Enter the verification code sent to your contact.</p>
      <p *ngIf="step() === 3">Enter your new secure password.</p>
    </div>

    <!-- Step 1: Request Code -->
    <form *ngIf="step() === 1" [formGroup]="contactForm" (ngSubmit)="onRequestCode()" class="space-y-5">
      <div class="form-group">
        <label for="email_or_phone">Email Address or Phone Number</label>
        <div class="input-wrapper">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9" />
          </svg>
          <input id="email_or_phone" type="text" formControlName="email_or_phone"
            placeholder="name@example.com or +123456789" required>
        </div>
      </div>

      <button type="submit" class="submit-btn" [disabled]="contactForm.invalid || isLoading()">
        <ng-container *ngIf="isLoading()">
          <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10" stroke-width="4" style="opacity: 0.25;"></circle>
            <path style="opacity: 0.75;" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
          </svg>
          Sending...
        </ng-container>
        <span *ngIf="!isLoading()">Send Verification Code</span>
      </button>
    </form>

    <!-- Step 2: Verify Code -->
    <form *ngIf="step() === 2" [formGroup]="verifyForm" (ngSubmit)="onVerifyCode()" class="space-y-5">
      <div class="form-group">
        <label for="code">Verification Code</label>
        <div class="input-wrapper">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
          </svg>
          <input id="code" type="text" formControlName="code" placeholder="123456" required>
        </div>
      </div>

      <button type="submit" class="submit-btn" [disabled]="verifyForm.invalid || isLoading()">
        <ng-container *ngIf="isLoading()">
          <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10" stroke-width="4" style="opacity: 0.25;"></circle>
            <path style="opacity: 0.75;" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
          </svg>
          Verifying...
        </ng-container>
        <span *ngIf="!isLoading()">Verify Code</span>
      </button>

      <div class="text-center mt-4">
        <button type="button" class="text-sm text-sky-400 hover:text-sky-300"
          (click)="step.set(1); errorMessage.set(null); successMessage.set(null)">
          Change Contact Info
        </button>
      </div>
    </form>

    <!-- Step 3: Reset Password -->
    <form *ngIf="step() === 3" [formGroup]="resetForm" (ngSubmit)="onResetPassword()" class="space-y-4">
      <div class="form-grid">
        <!-- PASSWORD -->
        <div class="form-group">
          <div class="password-header">
            <label for="password">New Password</label>
            <button type="button" class="show-btn" (click)="togglePassword()">
              {{ showPassword() ? 'Hide' : 'Show' }}
            </button>
          </div>
          <div class="input-wrapper">
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password"
              placeholder="Enter new password" required>
          </div>
        </div>

        <!-- PASSWORD CONFIRMATION -->
        <div class="form-group">
          <div class="password-header">
            <label for="password_confirmation">Confirm Password</label>
            <button type="button" class="show-btn" (click)="togglePasswordConfirmation()">
              {{ showPasswordConfirmation() ? 'Hide' : 'Show' }}
            </button>
          </div>
          <div class="input-wrapper">
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            <input id="password_confirmation" [type]="showPasswordConfirmation() ? 'text' : 'password'"
              formControlName="password_confirmation" placeholder="Confirm new password" required>
          </div>
        </div>
      </div>

      <button type="submit" class="submit-btn" [disabled]="resetForm.invalid || isLoading()">
        <ng-container *ngIf="isLoading()">
          <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10" stroke-width="4" style="opacity: 0.25;"></circle>
            <path style="opacity: 0.75;" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
          </svg>
          Resetting...
        </ng-container>
        <span *ngIf="!isLoading()">Reset Password</span>
      </button>
    </form>

    <!-- ERROR & SUCCESS MESSAGES -->
    <div *ngIf="errorMessage()" class="error mt-4">
      {{ errorMessage() }}
    </div>
    <div *ngIf="successMessage()" class="success mt-4">
      {{ successMessage() }}
    </div>

    <!-- Back to Login -->
    <div class="signup">
      <p>
        Remembered your password?
        <a routerLink="/auth/login">Back to Login</a>
      </p>
    </div>

  </div>
</div>
