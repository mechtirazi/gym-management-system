<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon no-container">
        <img src="assets/images/logo_GMS.png" alt="Platform Logo"
          style="width: 100%; height: 100%; object-fit: contain;">
      </div>
      <span class="logo-text">
        <span>G<span class="text-primary">MS</span></span>
        <small class="role-badge">Nutritionist</small>
      </span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-scroll-wrapper">
      @for (item of navItems; track item.label) {
      @if (item.isHeader) {
      <div class="nav-header">{{ item.label }}</div>
      } @else {
      <a [routerLink]="item.route" routerLinkActive="active" class="nav-item" [attr.title]="item.label">
        <span class="nav-icon" [innerHTML]="getIcon(item.icon!)"></span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
      }
      }
    </div>
  </nav>

  <div class="sidebar-footer">
    <div class="support-card">
      <div class="support-icon">🥗</div>
      <div class="support-content">
        <p class="support-title">Nutrition workspace</p>
        <p class="support-desc">Manage client plans efficiently</p>
      </div>
      <button class="support-btn">
        <span>View Plans</span>
      </button>
    </div>
  </div>
</aside>
