<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon no-container">
        <img src="assets/images/logo_GMS.png" alt="Platform Logo"
          style="width: 100%; height: 100%; object-fit: contain;">
      </div>
      <div class="logo-text">
        <span class="brand-name">GMS</span>
        <span class="brand-role">Super Admin</span>
      </div>
    </div>
  </div>

  <nav class="sidebar-nav">
    @for (item of navItems; track item.label) {
    @if (item.isHeader) {
    <div class="nav-header">{{ item.label }}</div>
    } @else {
    <a [routerLink]="item.route" routerLinkActive="active" class="nav-item" [attr.title]="item.label">
      <span class="nav-icon" [innerHTML]="getIcon(item.icon!)"></span>
      <span class="nav-label">{{ item.label }}</span>
      @if (item.badge) {
      <span class="nav-badge" [class.badge-live]="item.badge === 'Live'">{{ item.badge }}</span>
      }
    </a>
    }
    }
  </nav>
</aside>
